<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Blog | Yobin Omkar Bangera</title>
  <meta name="description" content="Writing on data analytics, dashboards and business strategy by Yobin Omkar Bangera.">
  <meta name="theme-color" content="#0b1020">
  <link rel="canonical" href="https://yobinportfolio.vercel.app/blog">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/assets/js/theme-init.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/sections.css">
  <link rel="stylesheet" href="/assets/css/blog.css">

  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>

<body>

  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  </svg>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a href="/" class="brand" aria-label="Yobin Bangera, portfolio home">
        <span class="brand-mark" aria-hidden="true">YB</span>
        <span class="brand-name">Yobin Bangera</span>
      </a>

      <nav class="site-nav site-nav-simple" aria-label="Main">
        <ul>
          <li><a href="/">Portfolio</a></li>
          <li><a href="/blog" class="is-active" aria-current="page">Blog</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <button class="icon-button" id="themeToggle" type="button" aria-label="Switch colour theme">
          <svg class="icon icon-when-dark"><use href="#icon-sun"></use></svg>
          <svg class="icon icon-when-light"><use href="#icon-moon"></use></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="page">
    <div class="container">

      <header class="section-head">
        <p class="eyebrow">Blog</p>
        <h1 class="section-title">Writing</h1>
        <p class="section-lead">Notes on data analytics, dashboards and business strategy.</p>
      </header>

      <!-- Post cards are built here from blog/posts.json by assets/js/blog.js -->
      <div class="card-grid" data-blog-list></div>

      <p class="section-lead" data-blog-empty hidden>No posts yet. The first one is on its way.</p>

      <noscript><p class="section-lead">Turn on JavaScript to see the list of posts.</p></noscript>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year">2026</span> Yobin Omkar Bangera</p>
      <a href="/">Back to the portfolio</a>
    </div>
  </footer>

  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/blog.js" defer></script>
</body>
</html>
